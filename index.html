<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#1a365d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CJTA Pedidos">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de Pedido - Distribuidora CJTA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
  body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
  .app-container { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

  .app-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1a365d; padding-bottom: 10px; margin-bottom: 15px; }
  .app-logo { width: 60px; height: 60px; flex-shrink: 0; display: block; }
  .app-header .header-text { flex-grow: 1; text-align: center; padding: 0 10px; }
  .app-header h1 { font-size: 18px; color: #1a365d; margin: 0; text-transform: uppercase; font-weight: bold; }
  .app-header h2 { font-size: 13px; color: #4a5568; margin: 2px 0 0 0; }

  .form-group { margin-bottom: 12px; }
  label { font-size: 12px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
  input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }

  .product-search { margin-bottom: 15px; background: #edf2f7; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
  .product-search input { background: #fff; font-size: 15px; }

  .product-list { max-height: 400px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
  .product-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #edf2f7; }
  .product-item:last-child { border-bottom: none; }
  .product-info { font-size: 13px; flex-grow: 1; padding-right: 10px; }
  .product-category { display: inline-block; background: #e2e8f0; color: #2d3748; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-bottom: 3px; font-weight: bold; }
  .product-prices { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .price-field { display: flex; align-items: center; }
  .price-field span { margin-right: 2px; font-weight: bold; font-size: 12px; }
  .product-prices input { width: 80px; padding: 4px; font-size: 12px; text-align: right; }

  .product-qty { width: 70px; }
  .product-qty input { padding: 8px; text-align: center; font-weight: bold; width: 100%; box-sizing: border-box; border: 1px solid #a0aec0; border-radius: 6px; font-size: 15px; }

  .btn-generate { width: 100%; background-color: #25d366; color: #fff; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-generate:active { background-color: #1eb954; }
  .btn-generate:disabled { background-color: #a0aec0; cursor: not-allowed; }

  .btn-secondary { background-color: #3498db; color: #fff; border: none; padding: 8px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; }
  .btn-secondary:active { background-color: #2980b9; }

  .totals-section { background: #edf2f7; padding: 12px; border-radius: 8px; margin-top: 15px; }
  .total-item { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; }
  .total-item span:first-child { font-weight: bold; }
  .total-usd { color: #1a365d; font-weight: bold; }
  .total-ves { color: #c0392b; font-weight: bold; }

  .iva-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .iva-btn { flex: 1; padding: 10px; border: 2px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
  .iva-btn.active { border-color: #1a365d; background: #e6f0ff; color: #1a365d; }

  .discount-info { background: #fff8e1; border: 1px solid #f0c040; border-radius: 6px; padding: 10px; margin-top: 10px; font-size: 12px; }

  .signature-container { border: 1px solid #cbd5e1; border-radius: 6px; background: #fafafa; padding: 5px; max-width: 100%; overflow: hidden; }
  .signature-canvas { width: 100%; max-width: 100%; height: 120px; border: 1px dashed #a0aec0; border-radius: 4px; background: #fff; display: block; touch-action: none; }

  .seal-preview { max-width: 100%; max-height: 120px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 4px; display: none; }

  .pdf-temp-container { position: fixed; top: 0; left: 0; width: 750px; z-index: -1; background: white; opacity: 1; pointer-events: none; }
  .pdf-page { width: 750px; padding: 20px; font-family: Arial, sans-serif; font-size: 10px; background: #fff; color: #000; box-sizing: border-box; }
  .pdf-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px; }
  .pdf-logo-container { width: 100px; min-width: 100px; }
  .pdf-logo { width: 80px; height: 80px; display: block; }
  .pdf-title { text-align: center; flex-grow: 1; }
  .pdf-title h1 { font-size: 15px; margin: 0; font-weight: bold; }
  .pdf-title h2 { font-size: 11px; margin: 2px 0 0 0; }
  .pdf-qr-container { width: 80px; min-width: 80px; text-align: center; }
  .pdf-qr-container img { width: 70px; height: 70px; }
  .pdf-qr-label { font-size: 7px; margin-top: 2px; }

  .pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .pdf-table th, .pdf-table td { border: 1px solid #444; padding: 4px; font-size: 9px; text-align: left; }
  .pdf-table th { background: #e6e6e6; font-weight: bold; }
  .center { text-align: center; }
  .right { text-align: right; }

  .pdf-section-title { background: #1a365d; color: #fff; padding: 4px 6px; font-size: 9px; font-weight: bold; margin: 8px 0 4px 0; }
  .pdf-totals { border: 1px solid #444; padding: 8px; background: #fafafa; margin-top: 8px; font-size: 10px; }
  .pdf-totals-row { display: flex; justify-content: space-between; margin: 2px 0; }
  .pdf-observaciones { border: 1px solid #444; padding: 6px; margin-top: 8px; font-size: 9px; min-height: 40px; }
  .pdf-signature-section { display: flex; justify-content: space-between; margin-top: 15px; }
  .pdf-signature-box { width: 48%; min-height: 100px; border: 1px solid #444; padding: 6px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .pdf-signature-box img { max-width: 100%; max-height: 70px; margin-bottom: 4px; }
  .pdf-signature-box .label { font-size: 8px; font-weight: bold; margin-top: 4px; }

  @media (max-width: 480px) {
    .signature-canvas { height: 100px; }
    .product-prices input { width: 65px; }
    .app-logo { width: 50px; height: 50px; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <svg class="app-logo" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="100" fill="#1a365d" rx="10" ry="10"/>
      <text x="100" y="45" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">CJTA</text>
      <text x="100" y="70" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Lubricantes CARK</text>
    </svg>
    <div class="header-text">
      <h1>DISTRIBUIDORA CJTA</h1>
      <h2>LUBRICANTES CARK - HOJA DE PEDIDO</h2>
    </div>
  </div>

  <div class="form-group">
    <label>Cliente:</label>
    <input type="text" id="app-cliente" placeholder="Nombre o Razón Social del Cliente">
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>RIF:</label>
      <input type="text" id="app-rif" placeholder="J-12345678-9">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Vendedor:</label>
      <input type="text" id="app-vendedor" placeholder="Nombre del Vendedor">
    </div>
  </div>

  <div class="form-group">
    <label>📍 Ubicación en Google Maps (URL):</label>
    <input type="text" id="app-location" placeholder="https://maps.app.goo.gl/...">
  </div>

  <div class="product-search">
    <label>🔍 Buscar Producto:</label>
    <input type="text" id="search-input" placeholder="Escribe para buscar..." oninput="filterProducts()">
  </div>

  <label>Lista de Productos (Ingresa cantidad):</label>
  <div class="product-list" id="product-list-container">
    <div style="padding:15px; text-align:center; color:#718096;">Cargando catálogo...</div>
  </div>

  <div style="margin-top: 15px;">
    <label>Forma de Pago:</label>
    <select id="app-pago">
      <option value="Divisas">Divisas (efectivo USD, Zelle, USDT, transferencia)</option>
      <option value="Bolívares de contado">Bolívares de contado</option>
      <option value="Bolívares a crédito">Bolívares a crédito</option>
      <option value="Divisas de contado">Divisas + Contado</option>
      <option value="Divisas a crédito">Divisas a crédito</option>
    </select>
  </div>

  <div class="form-group" style="margin-top: 10px;">
    <label>IVA:</label>
    <div class="iva-toggle">
      <button type="button" class="iva-btn active" id="btn-iva-si" onclick="setIVA(true)">Con IVA (Factura)</button>
      <button type="button" class="iva-btn" id="btn-iva-no" onclick="setIVA(false)">Sin IVA (Nota de Entrega)</button>
    </div>
  </div>

  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>Días de Crédito:</label>
      <input type="text" id="app-dias" placeholder="30 a 45">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Horario Recepción:</label>
      <input type="text" id="app-horario" placeholder="8:00 AM - 12:00 PM">
    </div>
  </div>

  <div class="form-group">
    <label>Observaciones / Condiciones de Venta:</label>
    <textarea id="app-obs" rows="2" placeholder="Escribe o dicta cualquier detalle adicional..."></textarea>
  </div>

  <!-- TASA DE CAMBIO -->
  <div class="totals-section">
    <div class="form-group" style="margin-bottom: 8px;">
      <label>Tasa BCV del día (Bs. por USD):</label>
      <input type="number" id="app-tasa" step="0.01" min="0" placeholder="Ej. 36.50" oninput="updateTotals()">
    </div>

    <div class="total-item">
      <span>Subtotal USD:</span>
      <span class="total-usd" id="total-subtotal">$0.00</span>
    </div>
    <div class="total-item">
      <span>Descuentos aplicados:</span>
      <span id="total-descuentos">$0.00</span>
    </div>
    <div class="total-item" id="iva-row">
      <span>IVA (16%):</span>
      <span id="total-iva">$0.00</span>
    </div>
    <div class="total-item" style="border-top: 2px solid #1a365d; padding-top: 6px; margin-top: 6px;">
      <span>Total USD:</span>
      <span class="total-usd" id="total-usd">$0.00</span>
    </div>
    <div class="total-item">
      <span>Total Bolívares (Bs.):</span>
      <span class="total-ves" id="total-ves">Bs. 0.00</span>
    </div>

    <div class="discount-info" id="discount-info">
      <b>Descuentos automáticos:</b> <span id="discount-detail">Ninguno</span>
    </div>

    <div class="form-group" style="margin-top: 10px;">
      <label>Descuento adicional manual (%):</label>
      <input type="number" id="app-descuento-manual" step="0.01" min="0" max="100" placeholder="0" oninput="updateTotals()">
      <small style="color:#666; font-size:11px;">Usar solo si gerencia autorizó un descuento especial</small>
    </div>
  </div>

  <!-- FIRMA DIGITAL -->
  <div class="form-group" style="margin-top: 15px;">
    <label>✍️ Firma del Cliente:</label>
    <div class="signature-container">
      <canvas id="signature-canvas" class="signature-canvas"></canvas>
      <button type="button" class="btn-secondary" onclick="clearSignature()">🗑️ Limpiar firma</button>
    </div>
  </div>

  <!-- CAPTURA DE SELLO -->
  <div class="form-group">
    <label>📸 Sello de la Empresa / Recepción:</label>
    <button type="button" class="btn-secondary" onclick="document.getElementById('seal-input').click()">📷 Tomar foto o seleccionar de galería</button>
    <input type="file" id="seal-input" accept="image/*" style="display: none;" onchange="handleSealUpload(event)">
    <img id="seal-preview" class="seal-preview" alt="Vista previa del sello">
  </div>

  <button class="btn-generate" id="btn-generate" onclick="generatePDF(false)">
    📄 GENERAR PDF DEL PEDIDO
  </button>

  <button class="btn-generate" style="background-color: #3498db;" onclick="generatePDF(true)">
    🖨️ GENERAR HOJA IMPRIMIBLE EN BLANCO
  </button>
</div>

<script>
// ========== VARIABLES GLOBALES ==========
let catalog = [];
let config = { iva: 0.16, descuentos: {}, equivalencias: {}, condiciones: {} };
const quantities = {};
let signaturePad;
let sealDataURL = null;
let aplicarIVA = true;

// ========== CARGA DE DATOS ==========
async function cargarDatos() {
  try {
    const res = await fetch('precios.json?v=' + Date.now());
    if (!res.ok) throw new Error('No se pudo cargar precios.json');
    const data = await res.json();

    catalog = data.productos.filter(p => p.activo !== false);
    config = {
      iva: data.iva || 0.16,
      descuentos: data.descuentos || {},
      equivalencias: data.equivalencias || {},
      condiciones: data.condiciones || {}
    };

    // Precargar condiciones por defecto
    if (config.condiciones.diasCredito) {
      document.getElementById('app-dias').value = config.condiciones.diasCredito;
    }
    if (config.condiciones.horarioRecepcion) {
      document.getElementById('app-horario').value = config.condiciones.horarioRecepcion;
    }
    if (config.condiciones.observaciones) {
      document.getElementById('app-obs').value = config.condiciones.observaciones;
    }

    renderCatalog(catalog);
    updateTotals();
  } catch (e) {
    console.error('Error cargando datos:', e);
    document.getElementById('product-list-container').innerHTML = 
      '<div style="padding:15px; text-align:center; color:#c0392b;">Error cargando catálogo. Verifica conexión.</div>';
  }
}

// ========== RENDERIZADO ==========
function renderCatalog(items) {
  const container = document.getElementById('product-list-container');
  container.innerHTML = '';
  if (items.length === 0) {
    container.innerHTML = '<div style="padding:15px; text-align:center; color:#718096;">No se encontraron productos.</div>';
    return;
  }

  items.forEach((item) => {
    const qty = quantities[item.code] || '';
    container.innerHTML += `
      <div class="product-item" data-code="${item.code}">
        <div class="product-info">
          <span class="product-category">${item.cat}</span><br>
          <b>${item.name}</b> (${item.present})<br>
          <small style="color:#666;">CÓD: ${item.code} · ${item.tipo || ''}</small>
        </div>
        <div class="product-prices">
          <div class="price-field">
            <span>$</span>
            <input type="number" step="0.01" min="0" value="${item.priceUSD.toFixed(2)}" 
                   oninput="handlePriceEdit('${item.code}', this.value)" 
                   data-code="${item.code}" 
                   title="Precio de lista USD">
          </div>
        </div>
        <div class="product-qty">
          <input type="number" min="0" value="${qty}" placeholder="0" 
                 oninput="updateQty('${item.code}', this.value)">
        </div>
      </div>
    `;
  });
}

function filterProducts() {
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  if (!query) {
    renderCatalog(catalog);
    return;
  }
  const filtered = catalog.filter(p => 
    p.name.toLowerCase().includes(query) || 
    p.code.toLowerCase().includes(query) || 
    p.present.toLowerCase().includes(query) || 
    p.cat.toLowerCase().includes(query) ||
    (p.tipo && p.tipo.toLowerCase().includes(query))
  );
  renderCatalog(filtered);
}

function handlePriceEdit(code, value) {
  const numValue = parseFloat(value);
  if (isNaN(numValue) || numValue < 0) return;
  const item = catalog.find(p => p.code === code);
  if (item) item.priceUSD = numValue;
  updateTotals();
}

function updateQty(code, value) {
  quantities[code] = value;
  updateTotals();
}

// ========== CÁLCULO DE CAJAS EQUIVALENTES ==========
function calcularCajasEquivalentes() {
  let cajas = 0;
  catalog.forEach(item => {
    const qty = parseInt(quantities[item.code]) || 0;
    if (qty <= 0) return;

    if (item.cat.includes('CAJAS')) cajas += qty;
    else if (item.cat.includes('BIDONES')) cajas += qty * (config.equivalencias.bidon || 1.5);
    else if (item.cat.includes('PAILAS')) cajas += qty * (config.equivalencias.paila || 1.5);
    else if (item.cat.includes('TAMBOR') && !item.cat.includes('GRASA')) cajas += qty * (config.equivalencias.tambor || 15);
  });
  return cajas;
}

// ========== CÁLCULO DE DESCUENTOS ==========
function calcularDescuentos() {
  const formaPago = document.getElementById('app-pago').value;
  const cajas = calcularCajasEquivalentes();
  const desc = config.descuentos;

  let descDivisas = 0;
  let descContado = 0;
  let descVolumen = 0;

  if (formaPago.includes('Divisas')) {
    descDivisas = desc.divisas || 0.20;
  }
  if (formaPago.includes('contado') || formaPago === 'Divisas de contado') {
    descContado = desc.contado || 0.05;
  }
  if (cajas >= 100) {
    descVolumen = desc.volumen100 || 0.10;
  } else if (cajas >= 40) {
    descVolumen = desc.volumen40 || 0.05;
  }

  return { descDivisas, descContado, descVolumen, cajas };
}

// ========== TOTALES ==========
function updateTotals() {
  const tasa = parseFloat(document.getElementById('app-tasa').value) || 0;
  const descManualPct = (parseFloat(document.getElementById('app-descuento-manual').value) || 0) / 100;

  let subtotalUSD = 0;
  const itemsConCantidad = [];

  catalog.forEach(item => {
    const qty = parseInt(quantities[item.code]) || 0;
    if (qty > 0) {
      const subtotalItem = item.priceUSD * qty;
      subtotalUSD += subtotalItem;
      itemsConCantidad.push({ ...item, qty, subtotalItem });
    }
  });

  const { descDivisas, descContado, descVolumen, cajas } = calcularDescuentos();

  // Descuentos en escalera
  let precio = subtotalUSD;
  precio = precio * (1 - descDivisas);
  precio = precio * (1 - descContado);
  precio = precio * (1 - descVolumen);
  precio = precio * (1 - descManualPct);

  const descuentoTotal = subtotalUSD - precio;
  const iva = aplicarIVA ? precio * config.iva : 0;
  const totalUSD = precio + iva;
  const totalVES = totalUSD * tasa;

  // Actualizar UI
  document.getElementById('total-subtotal').textContent = `$${subtotalUSD.toFixed(2)}`;
  document.getElementById('total-descuentos').textContent = `-$${descuentoTotal.toFixed(2)}`;
  document.getElementById('total-iva').textContent = `$${iva.toFixed(2)}`;
  document.getElementById('total-usd').textContent = `$${totalUSD.toFixed(2)}`;
  document.getElementById('total-ves').textContent = `Bs. ${totalVES.toFixed(2)}`;
  document.getElementById('iva-row').style.display = aplicarIVA ? 'flex' : 'none';

  // Detalle de descuentos
  const detalles = [];
  if (descDivisas > 0) detalles.push(`Divisas ${(descDivisas*100).toFixed(0)}%`);
  if (descContado > 0) detalles.push(`Contado ${(descContado*100).toFixed(0)}%`);
  if (descVolumen > 0) detalles.push(`Volumen ${(descVolumen*100).toFixed(0)}% (${cajas.toFixed(1)} cajas)`);
  if (descManualPct > 0) detalles.push(`Manual ${(descManualPct*100).toFixed(1)}%`);
  
  document.getElementById('discount-detail').textContent = detalles.length > 0 
    ? detalles.join(' · ') 
    : `Ninguno (${cajas.toFixed(1)} cajas equivalentes)`;
}

// ========== IVA TOGGLE ==========
function setIVA(valor) {
  aplicarIVA = valor;
  document.getElementById('btn-iva-si').classList.toggle('active', valor);
  document.getElementById('btn-iva-no').classList.toggle('active', !valor);
  updateTotals();
}

// ========== FIRMA ==========
window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('signature-canvas');
  signaturePad = new SignaturePad(canvas, {
    backgroundColor: 'rgba(255, 255, 255, 0)',
    penColor: 'rgb(0, 0, 0)'
  });
  
  function resizeCanvas() {
    const container = canvas.parentElement;
    const width = container.offsetWidth - 10;
    const height = 120;
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.getContext('2d').scale(ratio, ratio);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    if (signaturePad) signaturePad.clear();
  }
  
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 100);
  
  cargarDatos();
});

function clearSignature() {
  if (signaturePad) signaturePad.clear();
}

// ========== SELLO ==========
function handleSealUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    sealDataURL = e.target.result;
    const preview = document.getElementById('seal-preview');
    preview.src = sealDataURL;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

// ========== QR ==========
function generateQRCode(url) {
  return new Promise((resolve) => {
    const qrContainer = document.createElement('div');
    qrContainer.style.position = 'fixed';
    qrContainer.style.left = '-9999px';
    document.body.appendChild(qrContainer);
    new QRCode(qrContainer, {
      text: url, width: 80, height: 80,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    setTimeout(() => {
      const img = qrContainer.querySelector('img');
      const canvas = qrContainer.querySelector('canvas');
      let dataURL;
      if (img) dataURL = img.src;
      else if (canvas) dataURL = canvas.toDataURL('image/png');
      qrContainer.remove();
      resolve(dataURL);
    }, 100);
  });
}

    categorias[item.cat].push(item);
  });

  // Si es hoja en blanco, mostrar todas las categorías con campos vacíos
  let categoriasMostrar = categorias;
  if (esBlanco) {
    categoriasMostrar = {};
    catalog.forEach(item => {
      if (!categoriasMostrar[item.cat]) categoriasMostrar[item.cat] = [];
      categoriasMostrar[item.cat].push(item);

  }

  let tablasHTML = '';

    tablasHTML += `

        <thead>
          <tr><th>CÓDIGO</th><th>PRODUCTO</th><th class="center">PRECIO</th><th class="center">CANT.</th><th class="center">SUBTOTAL</th></tr>
        </thead>
        <tbody>${filas}</tbody>

  // Totales (solo si no es blanco)

      <div class="pdf-totals-row"><b>Descuentos:</b> <span>$__________</span></div>
      <div class="pdf-totals-row"><b>IVA (16%):</b> <span>$__________</span></div>
      <div class="pdf-totals-row" style="border-top:1px solid #444; padding-top:3px; margin-top:3px;"><b>TOTAL USD:</b> <span>$__________</span></div>
      <div class="pdf-totals-row"><b>TOTAL Bs.:</b> <span>Bs. __________</span></div>
    </div>
  ` : `
    <div class="pdf-totals">
      <div class="pdf-totals-row"><b>Subtotal USD:</b> <span>$${totales.subtotal.toFixed(2)}</span></div>
      <div class="pdf-totals-row"><b>Descuentos aplicados:</b> <span>-$${totales.descuentos.toFixed(2)}</span></div>
      ${aplicarIVA ? `<div class="pdf-totals-row"><b>IVA (16%):</b> <span>$${totales.iva.toFixed(2)}</span></div>` : ''}
      <div class="pdf-totals-row" style="border-top:1px solid #444; padding-top:3px; margin-top:3px;"><b>TOTAL USD:</b> <span>$${totales.totalUSD.toFixed(2)}</span></div>
      <div class="pdf-totals-row"><b>TOTAL Bs. (tasa ${tasa.toFixed(2)}):</b> <span>Bs. ${totales.totalVES.toFixed(2)}</span></div>
    </div>
  `;

  const firmaImg = firma ? `<img src="${firma}" alt="Firma">` : '';
  const selloImg = sello ? `<img src="${sello}" alt="Sello">` : '';
  const qrImg = qr ? `<img src="${qr}" alt="QR">` : '';

  return `
    <div class="pdf-page">
      <div class="pdf-header">
        <div class="pdf-logo-container">
          <svg class="pdf-logo" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <rect width="200" height="100" fill="#1a365d" rx="10" ry="10"/>
            <text x="100" y="45" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="bold">CJTA</text>
            <text x="100" y="70" font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Lubricantes CARK</text>

        </div>

          <h1>DISTRIBUIDORA CJTA - LUBRICANTES CARK</h1>

// ========== GENERAR PDF ==========
async function generatePDF(esBlanco) {
  const btn = event.target;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ GENERANDO...';

  try {
    const cliente = document.getElementById('app-cliente').value || 'N/A';
    const rif = document.getElementById('app-rif').value || 'N/A';
    const vendedor = document.getElementById('app-vendedor').value || 'N/A';
    const formaPago = document.getElementById('app-pago').value;
    const dias = document.getElementById('app-dias').value || '0';
    const horario = document.getElementById('app-horario').value || 'N/A';
    const obs = document.getElementById('app-obs').value || 'Ninguna';
    const locationURL = document.getElementById('app-location').value.trim();
    const tasa = parseFloat(document.getElementById('app-tasa').value) || 0;
    const descManualPct = (parseFloat(document.getElementById('app-descuento-manual').value) || 0) / 100;

    // Calcular items
    const items = [];
    let subtotalUSD = 0;
    catalog.forEach(item => {
      const qty = parseInt(quantities[item.code]) || 0;
      if (qty > 0) {
        const subtotalItem = item.priceUSD * qty;
        subtotalUSD += subtotalItem;
        items.push({ ...item, qty, subtotalItem });
      }
    });

    if (!esBlanco && items.length === 0) {
      alert('Por favor coloca al menos un producto con cantidad mayor a 0.');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    const { descDivisas, descContado, descVolumen, cajas } = calcularDescuentos();

    let precio = subtotalUSD;
    precio = precio * (1 - descDivisas);
    precio = precio * (1 - descContado);
    precio = precio * (1 - descVolumen);
    precio = precio * (1 - descManualPct);

    const descuentos = subtotalUSD - precio;
    const iva = aplicarIVA ? precio * config.iva : 0;
    const totalUSD = precio + iva;
    const totalVES = totalUSD * tasa;

    const totales = { subtotal: subtotalUSD, descuentos, iva, totalUSD, totalVES };

    const listaDescuentos = [];
    if (descDivisas > 0) listaDescuentos.push(`Divisas ${(descDivisas*100).toFixed(0)}%`);
    if (descContado > 0) listaDescuentos.push(`Contado ${(descContado*100).toFixed(0)}%`);
    if (descVolumen > 0) listaDescuentos.push(`Volumen ${(descVolumen*100).toFixed(0)}%`);
    if (descManualPct > 0) listaDescuentos.push(`Manual ${(descManualPct*100).toFixed(1)}%`);

    const firma = signaturePad && !signaturePad.isEmpty() ? signaturePad.toDataURL('image/png') : null;
    const qr = locationURL ? await generateQRCode(locationURL) : null;

    const datos = { cliente, rif, vendedor, formaPago, dias, horario, obs, tasa, cajas, descuentos: listaDescuentos };

    const tempDiv = document.createElement('div');
    tempDiv.className = 'pdf-temp-container';
    tempDiv.innerHTML = buildPdfHTML(datos, items, totales, firma, sealDataURL, qr, esBlanco);
    document.body.appendChild(tempDiv);

    await new Promise(resolve => {
      const images = tempDiv.querySelectorAll('img');
      let loaded = 0;
      if (images.length === 0) resolve();
      images.forEach(img => {
        img.onload = () => { loaded++; if (loaded === images.length) resolve(); };
        img.onerror = () => { img.style.display = 'none'; loaded++; if (loaded === images.length) resolve(); };
        if (img.complete) { loaded++; if (loaded === images.length) resolve(); }
      });
    });

    const canvas = await html2canvas(tempDiv, {
      scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff'
    });
    tempDiv.remove();

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = canvas.width;
    const imgHeight = canvas.height;
    const ratio = Math.min(pdfWidth / imgWidth, pdfHeight / imgHeight);
    const imgX = (pdfWidth - imgWidth * ratio) / 2;

    pdf.addImage(imgData, 'JPEG', imgX, 0, imgWidth * ratio, imgHeight * ratio);

    let heightLeft = imgHeight * ratio - pdfHeight;
    let position = -pdfHeight;
    while (heightLeft > 0) {
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', imgX, position, imgWidth * ratio, imgHeight * ratio);
      heightLeft -= pdfHeight;
      position -= pdfHeight;
    }

    const nombreArchivo = esBlanco 
      ? `Hoja_Pedido_Blanco_${cliente.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`
      : `Pedido_${cliente.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`;
    
    pdf.save(nombreArchivo);

    btn.textContent = originalText;
    btn.disabled = false;
  } catch (error) {
    console.error('Error:', error);
    alert('Ocurrió un error. Inténtalo de nuevo.');
    btn.textContent = originalText;
    btn.disabled = false;
  }
}
