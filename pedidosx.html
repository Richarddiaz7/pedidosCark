<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  /* ====== ESTILOS GENERALES ====== */
  body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
  .app-container { max-width: 650px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

  .app-header { text-align: center; border-bottom: 2px solid #1a365d; padding-bottom: 10px; margin-bottom: 15px; }
  .app-header img { max-width: 140px; height: auto; display: block; margin: 0 auto 8px auto; }
  .app-header h1 { font-size: 18px; color: #1a365d; margin: 5px 0 0 0; text-transform: uppercase; font-weight: bold; }
  .app-header h2 { font-size: 13px; color: #4a5568; margin: 2px 0 0 0; }

  .form-group { margin-bottom: 12px; }
  label { font-size: 12px; font-weight: bold; color: #2d3748; display: block; margin-bottom: 4px; }
  input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }

  .product-search { margin-bottom: 15px; background: #edf2f7; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; }
  .product-search input { background: #fff; font-size: 15px; }

  .product-list { max-height: 400px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
  .product-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #edf2f7; }
  .product-item:last-child { border-bottom: none; }
  .product-info { font-size: 13px; flex-grow: 1; padding-right: 10px; }
  .product-category { display: inline-block; background: #e2e8f0; color: #2d3748; font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-bottom: 3px; font-weight: bold; }
  .product-prices { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .price-field { display: flex; align-items: center; }
  .price-field span { margin-right: 2px; font-weight: bold; }
  .product-prices input { width: 70px; padding: 4px; font-size: 12px; text-align: right; }

  .product-qty { width: 70px; }
  .product-qty input { padding: 8px; text-align: center; font-weight: bold; width: 100%; box-sizing: border-box; border: 1px solid #a0aec0; border-radius: 6px; font-size: 15px; }

  .btn-generate { width: 100%; background-color: #25d366; color: #fff; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-generate:active { background-color: #1eb954; }
  .btn-generate:disabled { background-color: #a0aec0; cursor: not-allowed; }

  .btn-secondary { background-color: #3498db; color: #fff; border: none; padding: 8px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-secondary:active { background-color: #2980b9; }

  .totals-section { background: #edf2f7; padding: 12px; border-radius: 8px; margin-top: 15px; }
  .total-item { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; }
  .total-item span:first-child { font-weight: bold; }
  .total-usd { color: #1a365d; font-weight: bold; }
  .total-ves { color: #c0392b; font-weight: bold; }

  /* ====== ESTILOS PARA LA FIRMA ====== */
  .signature-container { 
    border: 1px solid #cbd5e1; 
    border-radius: 6px; 
    background: #fafafa; 
    padding: 5px; 
    max-width: 100%; 
    overflow: hidden; 
  }
  .signature-canvas { 
    width: 100%; 
    max-width: 100%; 
    height: 120px; 
    border: 1px dashed #a0aec0; 
    border-radius: 4px; 
    background: #fff; 
    display: block; 
    touch-action: none; 
  }

  /* ====== PLANTILLA PDF ====== */
  .pdf-temp-container { position: fixed; top: 0; left: 0; width: 750px; z-index: -1; background: white; opacity: 1; pointer-events: none; }
  .pdf-page { width: 750px; padding: 20px; font-family: Arial, sans-serif; font-size: 11px; background: #fff; color: #000; box-sizing: border-box; }
  .pdf-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
  .pdf-logo-container { width: 120px; min-width: 120px; min-height: 60px; }
  .pdf-logo { width: 110px; height: auto; display: block; }
  .pdf-title { text-align: center; flex-grow: 1; }
  .pdf-title h1 { font-size: 16px; margin: 0; font-weight: bold; }
  .pdf-title h2 { font-size: 12px; margin: 2px 0 0 0; }
  .pdf-qr-container { width: 80px; min-width: 80px; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .pdf-qr-container img { width: 70px; height: 70px; }
  .pdf-qr-label { font-size: 8px; margin-top: 2px; }

  .pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  .pdf-table th, .pdf-table td { border: 1px solid #444; padding: 5px; font-size: 10px; text-align: left; }
  .pdf-table th { background: #e6e6e6; font-weight: bold; }
  .center { text-align: center; }
  .pdf-footer { border: 1px solid #444; padding: 8px; background: #fafafa; margin-top: 10px; font-size: 10px; }

  .pdf-totals { margin: 10px 0; padding: 8px; border: 1px solid #444; background: #fafafa; font-size: 10px; }
  .pdf-signature-section { display: flex; justify-content: space-between; margin-top: 20px; }
  .pdf-signature-box { width: 48%; min-width: 120px; min-height: 120px; border: 1px solid #444; padding: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .pdf-signature-box img { max-width: 100%; max-height: 80px; margin-bottom: 5px; }
  .pdf-signature-box .label { font-size: 9px; font-weight: bold; margin-top: 5px; }

  @media (max-width: 480px) {
    .signature-canvas { height: 100px; }

<div class="app-container">
  <div class="app-header">
    <img id="app-logo-img" src="logo.jpg" alt="Logo CJTA" onerror="this.style.display='none'">
    <h1>DISTRIBUIDORA CJTA</h1>
    <h2>LUBRICANTES CARK - HOJA DE PEDIDO</h2>
  </div>

  <div class="form-group">
    <label>Cliente:</label>
    <input type="text" id="app-cliente" placeholder="Nombre o Razón Social del Cliente">
  </div>

  <div style="display: flex; gap: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>RIF:</label>
      <input type="text" id="app-rif" placeholder="J-12345678-9">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Vendedor:</label>
      <input type="text" id="app-vendedor" placeholder="Nombre del Vendedor">
    </div>
  </div>

  <div class="form-group">
    <label>📍 Ubicación en Google Maps (URL):</label>
    <input type="text" id="app-location" placeholder="https://maps.app.goo.gl/...">
  </div>

  <div class="product-search">
    <label>🔍 Buscar Producto:</label>
    <input type="text" id="search-input" placeholder="Escribe para buscar..." oninput="filterProducts()">
  </div>

  <label>Lista de Productos (Ingresa cantidad y ajusta precios si es necesario):</label>
  <div class="product-list" id="product-list-container"></div>

  <div style="margin-top: 15px;">
    <label>Forma de Pago:</label>
    <select id="app-pago">
      <option value="Contado en dólares">Contado en dólares</option>
      <option value="Crédito en dólares">Crédito en dólares</option>
      <option value="Contado en bolívares">Contado en bolívares</option>
      <option value="Crédito en bolívares">Crédito en bolívares</option>
    </select>
  </div>

  <div class="form-group" style="margin-top: 10px;">
    <label>Visualización de precios en el PDF:</label>
    <select id="app-price-display">
      <option value="ambos">Mostrar ambos precios (USD y Bs.)</option>
      <option value="pago">Mostrar solo moneda de pago</option>
    </select>
  </div>

  <div style="display: flex; gap: 10px; margin-top: 10px;">
    <div class="form-group" style="flex: 1;">
      <label>Días de Crédito:</label>
      <input type="text" id="app-dias" placeholder="0">
    </div>
    <div class="form-group" style="flex: 1;">
      <label>Horario Recepción:</label>
      <input type="text" id="app-horario" placeholder="Ej. 8:00 AM - 12:00 PM">
    </div>
  </div>

  <div class="form-group">
    <label>Observaciones / Condiciones de Venta:</label>
    <textarea id="app-obs" rows="2" placeholder="Escribe o dicta cualquier detalle adicional..."></textarea>
  </div>

  <!-- TASA DE CAMBIO Y TOTALES -->
  <div class="totals-section">
    <div class="form-group" style="margin-bottom: 8px;">
      <label>Tasa de Cambio (Bs. por USD):</label>
      <input type="number" id="app-tasa" step="0.01" min="0" placeholder="Ej. 36.50" oninput="updateTotals()">
    </div>
    <div class="total-item">
      <span>Total en USD ($):</span>
      <span class="total-usd" id="total-usd">$0.00</span>
    </div>
    <div class="total-item">
      <span>Total en Bolívares (Bs.):</span>
      <span class="total-ves" id="total-ves">Bs. 0.00</span>
    </div>
  </div>

  <!-- FIRMA DIGITAL -->
  <div class="form-group" style="margin-top: 15px;">
    <label>✍️ Firma del Cliente:</label>
    <div class="signature-container">
      <canvas id="signature-canvas" class="signature-canvas"></canvas>
      <button type="button" class="btn-secondary" onclick="clearSignature()" style="margin-top: 5px;">🗑️ Limpiar firma</button>
    </div>
  </div>

  <!-- CAPTURA DE SELLO -->
  <div class="form-group">
    <label>📸 Sello de la Empresa / Recepción:</label>
    <button type="button" class="btn-secondary" onclick="document.getElementById('seal-input').click()">📷 Tomar foto o seleccionar de galería</button>
    <input type="file" id="seal-input" accept="image/*" style="display: none;" onchange="handleSealUpload(event)">
    <img id="seal-preview" class="seal-preview" alt="Vista previa del sello">
  </div>

  <button class="btn-generate" id="btn-generate" onclick="generatePDF()">
    📄 GENERAR Y DESCARGAR PDF
  </button>
</div>

// ========== VARIABLES GLOBALES ==========
const quantities = {};
const customPrices = {};
let signaturePad;
let sealDataURL = null;
let isUpdatingPrice = false;

// ========== FUNCIONES DE CATÁLOGO Y PRECIOS ==========
function getPriceUSD(item) {
  if (customPrices[item.code] && customPrices[item.code].usd !== undefined) {
    return customPrices[item.code].usd;
  }
  return item.priceUSD;
}

function getPriceBCV(item) {
  if (customPrices[item.code] && customPrices[item.code].bcv !== undefined) {
    return customPrices[item.code].bcv;
  }
  return item.priceBCV;
}

function getApplicablePrice(item, paymentType) {
  if (paymentType.includes('dólares')) {
    return getPriceUSD(item);
  } else {
    return getPriceBCV(item);
  }
}

function updateTotals() {
  const paymentType = document.getElementById('app-pago').value;
  const tasa = parseFloat(document.getElementById('app-tasa').value) || 0;
  let totalBaseUSD = 0;

  catalog.forEach(item => {
    const qty = quantities[item.code];
    if (qty && parseInt(qty) > 0) {
      const price = getApplicablePrice(item, paymentType);
      totalBaseUSD += price * parseInt(qty);
    }
  });

  const totalVES = totalBaseUSD * tasa;
  document.getElementById('total-usd').textContent = `$${totalBaseUSD.toFixed(2)}`;
  document.getElementById('total-ves').textContent = `Bs. ${totalVES.toFixed(2)}`;
}

function highlightApplicablePriceColumns() {
  const paymentType = document.getElementById('app-pago').value;
  const isUSD = paymentType.includes('dólares');
  document.querySelectorAll('.product-item').forEach(itemEl => {
    const usdInput = itemEl.querySelector('input[data-currency="usd"]');
    const bcvInput = itemEl.querySelector('input[data-currency="bcv"]');
    if (usdInput && bcvInput) {
      usdInput.style.backgroundColor = isUSD ? '#e6f7ff' : '';
      bcvInput.style.backgroundColor = !isUSD ? '#e6f7ff' : '';
    }
  });
}

function renderCatalog(items) {
  const container = document.getElementById('product-list-container');
  container.innerHTML = '';
  if (items.length === 0) {
    container.innerHTML = '<div style="padding:15px; text-align:center; color:#718096;">No se encontraron productos.</div>';
    return;
  }

  items.forEach((item) => {
    const qty = quantities[item.code] || '';
    const usdVal = getPriceUSD(item);
    const bcvVal = getPriceBCV(item);

    container.innerHTML += `
      <div class="product-item" data-code="${item.code}">
        <div class="product-info">
          <span class="product-category">${item.cat}</span><br>
          <b>${item.name}</b> (${item.present})<br>
          <small style="color:#666;">CÓD: ${item.code}</small>
        </div>
        <div class="product-prices">
          <div class="price-field">
            <span>$</span>
            <input type="number" step="0.01" min="0" value="${usdVal.toFixed(2)}" 
                   oninput="handlePriceEdit('${item.code}', 'usd', this.value)" 
                   data-code="${item.code}" data-currency="usd" 
                   title="Precio USD (aplica si paga en dólares)">
          </div>
          <div class="price-field">
            <span>BCV $</span>
            <input type="number" step="0.01" min="0" value="${bcvVal.toFixed(2)}" 
                   oninput="handlePriceEdit('${item.code}', 'bcv', this.value)" 
                   data-code="${item.code}" data-currency="bcv" 
                   title="Precio BCV (USD) (aplica si paga en bolívares)">
          </div>
        </div>
        <div class="product-qty">
          <input type="number" min="0" value="${qty}" placeholder="0" 
                 oninput="updateQty('${item.code}', this.value)">
        </div>
      </div>
    `;
  });

  highlightApplicablePriceColumns();
}

function handlePriceEdit(code, currency, value) {
  if (isUpdatingPrice) return;
  const numValue = parseFloat(value);
  if (isNaN(numValue) || numValue < 0) return;

  isUpdatingPrice = true;

  if (!customPrices[code]) {
    const baseItem = catalog.find(p => p.code === code);
    customPrices[code] = {
      usd: baseItem.priceUSD,
      bcv: baseItem.priceBCV
    };
  }

  const tasa = parseFloat(document.getElementById('app-tasa').value) || 0;

  if (currency === 'usd') {
    customPrices[code].usd = numValue;
    if (tasa > 0) {
      customPrices[code].bcv = numValue * tasa;
    }
  } else if (currency === 'bcv') {
    customPrices[code].bcv = numValue;
    if (tasa > 0) {
      customPrices[code].usd = numValue / tasa;
    }
  }

  const container = document.querySelector(`.product-item[data-code="${code}"]`);
  if (container) {
    const usdInput = container.querySelector('input[data-currency="usd"]');
    const bcvInput = container.querySelector('input[data-currency="bcv"]');
    if (usdInput && currency !== 'usd') usdInput.value = customPrices[code].usd.toFixed(2);
    if (bcvInput && currency !== 'bcv') bcvInput.value = customPrices[code].bcv.toFixed(2);
  }

  isUpdatingPrice = false;
  updateTotals();
}

function updateQty(code, value) {
  quantities[code] = value;
  updateTotals();
}

function filterProducts() {
  const query = document.getElementById('search-input').value.toLowerCase().trim();
  if (!query) {
    renderCatalog(catalog);
    return;
  }
  const filtered = catalog.filter(p => 
    p.name.toLowerCase().includes(query) || 
    p.code.toLowerCase().includes(query) || 
    p.present.toLowerCase().includes(query) || 
    p.cat.toLowerCase().includes(query)
  );
  renderCatalog(filtered);
}

// ========== INICIALIZACIÓN DE FIRMA ==========
window.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('signature-canvas');
  signaturePad = new SignaturePad(canvas, {
    backgroundColor: 'rgba(255, 255, 255, 0)',
    penColor: 'rgb(0, 0, 0)'
  });
  
  function resizeCanvas() {
    const container = canvas.parentElement;
    const width = container.offsetWidth - 10;
    const height = 120; // Altura fija
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    canvas.getContext('2d').scale(ratio, ratio);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    if (signaturePad) signaturePad.clear();
  }
  
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 100);
});

function clearSignature() {
  if (signaturePad) signaturePad.clear();
}

// ========== CAPTURA DE SELLO ==========
function handleSealUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    sealDataURL = e.target.result;
    const preview = document.getElementById('seal-preview');
    preview.src = sealDataURL;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

// ========== GENERACIÓN DE QR ==========
function generateQRCode(url) {
  return new Promise((resolve) => {
    const qrContainer = document.createElement('div');
    qrContainer.style.position = 'fixed';
    qrContainer.style.left = '-9999px';
    document.body.appendChild(qrContainer);
    const qr = new QRCode(qrContainer, {
      text: url,
      width: 80,
      height: 80,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    setTimeout(() => {
      const img = qrContainer.querySelector('img');
      const canvas = qrContainer.querySelector('canvas');
      let dataURL;
      if (img) dataURL = img.src;
      else if (canvas) dataURL = canvas.toDataURL('image/png');
      qrContainer.remove();
      resolve(dataURL);
    }, 100);
  });
}

// ========== GENERAR PDF ==========
async function generatePDF() {
  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.textContent = '⏳ GENERANDO PDF...';

  try {
    const cliente = document.getElementById('app-cliente').value || 'N/A';
    const rif = document.getElementById('app-rif').value || 'N/A';
    const vendedor = document.getElementById('app-vendedor').value || 'N/A';
    const pago = document.getElementById('app-pago').value;
    const dias = document.getElementById('app-dias').value || '0';
    const horario = document.getElementById('app-horario').value || 'N/A';
    const obs = document.getElementById('app-obs').value || 'Ninguna';
    const locationURL = document.getElementById('app-location').value.trim();
    const priceDisplayMode = document.getElementById('app-price-display').value;
    const tasa = parseFloat(document.getElementById('app-tasa').value) || 0;

    const selectedItems = [];
    let totalApplicableUSD = 0;

    catalog.forEach(item => {
      const qty = quantities[item.code];
      if (qty && parseInt(qty) > 0) {
        const usdPrice = getPriceUSD(item);
        const bcvPrice = getPriceBCV(item);
        const applicablePrice = getApplicablePrice(item, pago);
        totalApplicableUSD += applicablePrice * parseInt(qty);

        selectedItems.push({
          ...item,
          qty: parseInt(qty),
          priceUSD: usdPrice,
          priceBCV: bcvPrice
        });
      }
    });

    if (selectedItems.length === 0) {
      alert('Por favor coloca al menos un producto con cantidad mayor a 0 antes de generar el PDF.');
      btn.disabled = false;
      btn.textContent = '📄 GENERAR Y DESCARGAR PDF';
      return;
    }

    const totalApplicableVES = totalApplicableUSD * tasa;

    const signatureDataURL = signaturePad.isEmpty() ? null : signaturePad.toDataURL('image/png');
    const qrDataURL = locationURL ? await generateQRCode(locationURL) : null;

    const tempDiv = document.createElement('div');
    tempDiv.className = 'pdf-temp-container';
    tempDiv.innerHTML = buildPdfHTML(
      cliente, rif, vendedor, pago, dias, horario, obs,
      selectedItems, totalApplicableUSD, totalApplicableVES,
      signatureDataURL, sealDataURL, qrDataURL, priceDisplayMode, tasa
    );
    document.body.appendChild(tempDiv);

    await new Promise(resolve => {
      const images = tempDiv.querySelectorAll('img');
      let loaded = 0;
      if (images.length === 0) resolve();
      images.forEach(img => {
        img.onload = () => {
          loaded++;
          if (loaded === images.length) resolve();
        };
        img.onerror = () => {
          img.style.display = 'none';
          loaded++;
          if (loaded === images.length) resolve();
        };
        if (img.complete) {
          loaded++;
          if (loaded === images.length) resolve();
        }
      });
    });

    const canvas = await html2canvas(tempDiv, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#ffffff'
    });
    tempDiv.remove();

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const imgData = canvas.toDataURL('image/jpeg', 0.98);
    const pdfWidth = pdf.internal.pageSize.getWidth();
    const pdfHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = canvas.width;
    const imgHeight = canvas.height;
    const ratio = Math.min(pdfWidth / imgWidth, pdfHeight / imgHeight);
    const imgX = (pdfWidth - imgWidth * ratio) / 2;
    const imgY = 0;

    pdf.addImage(imgData, 'JPEG', imgX, imgY, imgWidth * ratio, imgHeight * ratio);

    let heightLeft = imgHeight * ratio - pdfHeight;
    let position = -pdfHeight;
    while (heightLeft > 0) {
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', imgX, position, imgWidth * ratio, imgHeight * ratio);
      heightLeft -= pdfHeight;
      position -= pdfHeight;
    }

    pdf.save(`Pedido_${cliente.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);

    btn.textContent = '📄 GENERAR Y DESCARGAR PDF';
    btn.disabled = false;
  } catch (error) {
    console.error('Error al generar PDF:', error);
    alert('Ocurrió un error al generar el PDF. Inténtalo de nuevo.');
    btn.textContent = '📄 GENERAR Y DESCARGAR PDF';
    btn.disabled = false;
  }
}

document.getElementById('app-pago').addEventListener('change', () => {
